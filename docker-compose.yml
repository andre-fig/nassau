services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nassau
      POSTGRES_PASSWORD: nassau
      POSTGRES_DB: nassau
    ports: ["5432:5432"]
    volumes: ["nassau-postgres:/var/lib/postgresql/data"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://nassau:nassau@postgres:5432/nassau
      PORT: 3000
      PUBLIC_WEB_URL: http://localhost:8081
    ports: ["3000:3000"]
    depends_on: [postgres]
volumes:
  nassau-postgres:
